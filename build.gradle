plugins {
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.0.15.RELEASE'
    id 'java'
}


repositories {
	mavenLocal() 
    mavenCentral()
}

dependencyManagement {
    imports {
        // This BOM dictates the correct Eureka version automatically
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2023.0.3" 
    }
}

dependencies {

// Comment out the old one and temporarily force a specific version
implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-server:4.1.3' 

   
}

test {
    useJUnitPlatform()
}
